# Complemento opcional. Mantiene las validaciones loopback de aplicación y fábrica.
x-rele: &rele
  image: ${COOPER_IMAGE:?Definir COOPER_IMAGE}
  entrypoint: [node, /rele/tunel.mjs]
  restart: unless-stopped
  # El socket pertenece a operador (UID 1001 en el VPS), no al usuario de datos.
  user: "${COOPER_RELE_UID:-1001}:${COOPER_RELE_GID:-1001}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 64m
  cpus: 0.25
  pids_limit: 32
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8789/salud').then(r=>process.exit(r.status===401?0:1),()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s
  environment:
    COOPER_RELE_MODO: vps
    COOPER_RELE_SOCKET: /tunel/puente.sock
    PUENTE_CODEX_TOKEN: ${PUENTE_CODEX_TOKEN:?Configurar token del VPS}
  volumes:
    - ../servicios/puente-codex/tunel.mjs:/rele/tunel.mjs:ro
    - /run/cooper-chat:/tunel:ro
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: "2"}
services:
  chat-cooper:
    <<: *rele
    network_mode: service:cooper
    depends_on: {cooper: {condition: service_healthy, restart: true}}
  chat-n8n:
    <<: *rele
    network_mode: service:n8n
    depends_on: {n8n: {condition: service_healthy, restart: true}}
  chat-runner:
    <<: *rele
    network_mode: service:runner
    depends_on: {runner: {condition: service_healthy, restart: true}}
