# Drop-in de usuario: ~/.config/systemd/user/cooper.service.d/chat-planes.conf
# Conserva el EnvironmentFile original de Cooper; referencia el token del puente sin copiarlo.
[Service]
WorkingDirectory=%h/Proyectos/cooper-wt/cooper-chat-planes/cooper
ExecStart=
ExecStart=/usr/bin/env COOPER_CHAT=auto COOPER_CHAT_API_RESPALDO=0 COOPER_DEMO=0 COOPER_DATABASE_PATH=%h/.local/share/cooper/cooper.sqlite COOPER_CLAUDE_BIN=%h/.local/bin/claude PUENTE_CODEX_URL=http://127.0.0.1:8789 /usr/bin/node %h/Proyectos/cooper-wt/cooper-chat-planes/cooper/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
EnvironmentFile=%h/.config/cooper/codex.env
Environment=PATH=/usr/bin:/bin:%h/.local/bin
# Los selectores en ExecStart prevalecen sobre EnvironmentFile y bloquean APIs de pago.
