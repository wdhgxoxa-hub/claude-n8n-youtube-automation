# Drop-in de usuario: ~/.config/systemd/user/cooper.service.d/chat-planes.conf
# Compatibilidad para unidades anteriores: usa la instalación y configuración fijas.
[Service]
WorkingDirectory=%h/.local/share/cooper/app/cooper
ExecStart=
ExecStart=/usr/bin/env NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 COOPER_TEST_MODE=0 COOPER_CHAT=auto COOPER_CHAT_API_RESPALDO=0 COOPER_DEMO=0 COOPER_MARCAS=simulada COOPER_DATABASE_PATH=%h/.local/share/cooper/cooper.sqlite COOPER_CLAUDE_BIN=%h/.local/bin/claude PUENTE_CODEX_URL=http://127.0.0.1:8789 /usr/bin/node %h/.local/share/cooper/app/cooper/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
EnvironmentFile=
EnvironmentFile=%h/.config/cooper/cooper.env
Environment=PATH=/usr/bin:/bin:%h/.local/bin
# Los selectores en ExecStart prevalecen sobre EnvironmentFile y bloquean APIs de pago.
