# No abre puertos TCP. El socket remoto solo lo puede usar su dueño.
Match User operador
    # OpenSSH comparte el permiso base de escucha con StreamLocal.
    # Permitir ese bit y denegar TODO listener TCP conserva solo el socket Unix.
    AllowTcpForwarding yes
    PermitListen none
    AllowStreamLocalForwarding remote
    StreamLocalBindUnlink yes
    StreamLocalBindMask 0177
Match all
