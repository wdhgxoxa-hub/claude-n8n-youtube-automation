name: ${COMPOSE_PROJECT_NAME:-cooper}
x-base: &base
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  stop_grace_period: 150s
services:
  cooper:
    <<: *base
    image: ${COOPER_IMAGE:?Definir COOPER_IMAGE}
    build:
      context: ..
      dockerfile: deploy/Containerfile
    read_only: true
    user: "1000:1000"
    tmpfs: ["/tmp:size=128m,mode=1777", "/app/.next/cache:size=64m,mode=1777"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    environment:
      AUTH_URL: ${COOPER_ORIGIN:?Definir COOPER_ORIGIN}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?Definir AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      COOPER_ADMIN_EMAIL: ${COOPER_ADMIN_EMAIL:?Definir COOPER_ADMIN_EMAIL}
      COOPER_DATABASE_PATH: /data/cooper.sqlite
      COOPER_FABRICA: ${COOPER_FABRICA:-n8n}
      COOPER_N8N_URL: http://n8n:5678/webhook/cooper/v1
      COOPER_N8N_TOKEN: ${COOPER_N8N_TOKEN:?Definir COOPER_N8N_TOKEN}
      COOPER_WEBHOOK_SECRET: ${COOPER_WEBHOOK_SECRET:?Definir COOPER_WEBHOOK_SECRET}
      COOPER_AVATAR: ${COOPER_AVATAR:-simulada}
      COOPER_VOZ_CLONADA: ${COOPER_VOZ_CLONADA:-simulada}
      COOPER_VOZ_CATALOGO: ${COOPER_VOZ_CATALOGO:-simulada}
      COOPER_TRANSCRIPCION: ${COOPER_TRANSCRIPCION:-simulada}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      COOPER_CHAT: ${COOPER_CHAT:-simulada}
      COOPER_CHAT_API_RESPALDO: ${COOPER_CHAT_API_RESPALDO:-0}
      PUENTE_CODEX_URL: ${PUENTE_CODEX_URL:-http://127.0.0.1:8789}
      PUENTE_CODEX_TOKEN: ${PUENTE_CODEX_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COOPER_CHAT_MODELO_CLAUDE: ${COOPER_CHAT_MODELO_CLAUDE:-claude-sonnet-5-5}
      COOPER_CHAT_MODELO_OPENAI: ${COOPER_CHAT_MODELO_OPENAI:-gpt-6.1-sol}
      COOPER_MENSAJERIA: ${COOPER_MENSAJERIA:-simulada}
      COOPER_MENSAJERIA_PAUSA: ${COOPER_MENSAJERIA_PAUSA:-0}
      COOPER_BIBLIOTECA_PAUSA: ${COOPER_BIBLIOTECA_PAUSA:-0}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      COOPER_MARCAS: ${COOPER_MARCAS:-simulada}
      COOPER_META_GRAPH_VERSION: ${COOPER_META_GRAPH_VERSION:-v27.0}
      COOPER_META_SYSTEM_TOKEN: ${COOPER_META_SYSTEM_TOKEN:-}
      UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY:-}
      COOPER_MARCAS_WORKER_SECRET: ${COOPER_MARCAS_WORKER_SECRET:-}
      COOPER_GASTO_ALERTA_USD: ${COOPER_GASTO_ALERTA_USD:-25}
    volumes: ["${DATA_ROOT:?Definir DATA_ROOT}/cooper:/data"]
    networks: [backend, salida]
  n8n:
    <<: *base
    image: ghcr.io/n8n-io/n8n:2.47.4
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/node/.cache:size=128m,mode=1777"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 250
    environment:
      N8N_HOST: ${N8N_DOMAIN:?Definir N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_ORIGIN:?Definir N8N_EDITOR_ORIGIN}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Definir N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_MODE: external
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "120"
      N8N_RUNNERS_TASK_TIMEOUT: "240"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Definir N8N_RUNNERS_AUTH_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_DISABLED_MODULES: mcp-registry
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "4"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      GENERIC_TIMEZONE: America/Lima
      COOPER_N8N_TOKEN: ${COOPER_N8N_TOKEN}
      COOPER_WEBHOOK_SECRET: ${COOPER_WEBHOOK_SECRET}
      COOPER_ADMIN_EMAIL: ${COOPER_ADMIN_EMAIL}
      COOPER_WEBHOOK_URL: http://cooper:3000/api/n8n/webhook
      COOPER_MARCAS_HABILITAR: ${COOPER_MARCAS_HABILITAR:-0}
      COOPER_MARCAS_URL: ${COOPER_MARCAS_URL:-${COOPER_ORIGIN}}
      COOPER_MARCAS_WORKER_SECRET: ${COOPER_MARCAS_WORKER_SECRET:-}
      PUENTE_CODEX_URL: ${PUENTE_CODEX_URL:-http://127.0.0.1:8789}
      PUENTE_CODEX_TOKEN: ${PUENTE_CODEX_TOKEN:-}
    volumes: ["${DATA_ROOT}/n8n:/home/node/.n8n"]
    networks: [backend, salida]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
  runner:
    <<: *base
    image: ghcr.io/n8n-io/runners:2.47.4
    command: [javascript]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/runner:size=64m,mode=1777"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 150
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_MAX_CONCURRENCY: "4"
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
      N8N_RUNNERS_GRACEFUL_SHUTDOWN_TIMEOUT: "10"
      N8N_RUNNERS_TASK_TIMEOUT: "240"
      COOPER_N8N_TOKEN: ${COOPER_N8N_TOKEN}
      COOPER_WEBHOOK_SECRET: ${COOPER_WEBHOOK_SECRET}
      COOPER_ADMIN_EMAIL: ${COOPER_ADMIN_EMAIL}
      COOPER_WEBHOOK_URL: http://cooper:3000/api/n8n/webhook
      COOPER_MARCAS_HABILITAR: ${COOPER_MARCAS_HABILITAR:-0}
      COOPER_MARCAS_URL: ${COOPER_MARCAS_URL:-${COOPER_ORIGIN}}
      COOPER_MARCAS_WORKER_SECRET: ${COOPER_MARCAS_WORKER_SECRET:-}
      PUENTE_CODEX_URL: ${PUENTE_CODEX_URL:-http://127.0.0.1:8789}
      PUENTE_CODEX_TOKEN: ${PUENTE_CODEX_TOKEN:-}
    volumes: ["./n8n-task-runners.json:/etc/n8n-task-runners.json:ro"]
    networks: [backend]
    depends_on:
      n8n: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5680/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
  caddy:
    <<: *base
    image: docker.io/library/caddy:2.11.2-alpine
    user: "1000:1000"
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${EDITOR_PORT:-8443}:8443"
    environment:
      COOPER_DOMAIN: ${COOPER_DOMAIN}
      COOPER_ORIGIN: ${COOPER_ORIGIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?Definir CADDY_TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${DATA_ROOT}/caddy-data:/data"
      - "${DATA_ROOT}/caddy-config:/config"
    networks: [backend, salida]
    depends_on:
      cooper: { condition: service_healthy }
      n8n: { condition: service_healthy }
networks:
  backend: { internal: true }
  salida: {}
